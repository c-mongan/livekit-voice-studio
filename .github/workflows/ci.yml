name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --package livekit-plugins-voicebox --extra dev --extra example --extra azure --extra agents --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m "not integration" --cov=livekit.plugins.voicebox
      - run: uv build --package livekit-plugins-voicebox
      - run: uv run --no-sync python examples/minimal_agent.py --help
      - run: uv run --no-sync python benchmarks/benchmark_tts.py --help
      - run: uv run --no-sync python -m examples.studio --help
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
