name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen --package livekit-plugins-voicebox --extra dev --extra example --extra azure --extra agents --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m "not integration" --cov=livekit.plugins.voicebox
      - name: Audit Python dependencies
        if: matrix.python == '3.12'
        # CVE-2026-114603 (opentelemetry-api tracestate ReDoS) is fixed in 1.45.1, but
        # livekit-agents 1.8.1 requires opentelemetry-api<1.45. Remove the ignore when
        # livekit-agents allows 1.45+. The studio does not parse inbound tracestate headers.
        run: uvx pip-audit==2.10.1 --ignore-vuln CVE-2026-114603 --path .venv/lib/python3.12/site-packages
      - run: uv build --package livekit-plugins-voicebox
      - run: uv run --no-sync python examples/minimal_agent.py --help
      - run: uv run --no-sync python benchmarks/benchmark_tts.py --help
      - run: uv run --no-sync python -m examples.studio --help
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
