name: Installation or conversation problem
description: Report a reproducible failure without sharing private audio or credentials.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting publicly.
        Never attach .env files, tokens, voice references, model files, private transcripts or raw service logs.
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Run git rev-parse --short HEAD in your checkout.
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Operating system, chip and RAM
      placeholder: macOS version, Apple chip, RAM size
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Selected components
      description: Local or remote LiveKit, recognizer, reasoning provider/model, speech backend. Names only; no addresses, keys or voice identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and result
      description: First failing step, expected result, observed result, and whether another attempt or typed input worked. Use a synthetic example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe diagnostic evidence
      description: Exact UI error, whether the session returned to Ready, available disk space and approximate memory pressure. Review screenshots before attaching them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed private audio, transcripts, credentials, tokens and personal paths.
          required: true
