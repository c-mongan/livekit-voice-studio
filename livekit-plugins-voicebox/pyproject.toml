[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-voicebox"
version = "0.1.0.dev0"
description = "Exclusive local Voicebox Qwen TTS provider for LiveKit Agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "livekit-agents==1.8.1",
    "livekit==1.1.18",
    "aiohttp==3.14.3",
    "numpy==2.3.5",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.14.10",
    "mypy==1.19.1",
]
example = [
    "livekit-plugins-openai==1.8.1",
    "livekit-plugins-silero==1.8.1",
    "python-dotenv==1.2.3",
]
azure = ["livekit-plugins-azure==1.8.1"]
mlx = ["mlx-audio==0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
agents = ["github-copilot-sdk==1.0.13"]
playback = ["sounddevice==0.5.6"]

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/README.md", "/LICENSE"]
